name: Deploy to GitHub Pages

# Builds and publishes on every push to main. Pages source must be set to
# "GitHub Actions" in Settings → Pages for this to do anything.
on:
  push:
    branches: [main]
  workflow_dispatch: # lets you re-deploy by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# If two pushes land close together, let the newer one win rather than
# queueing a deploy that's already out of date.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Vite 8 needs Node 20.19+ or 22.12+
          node-version: 22
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins, so the deployed
      # build matches what was tested locally.
      - run: npm ci

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
